name: Rust system tests
on:
  push:
    branches: [main]
    paths-ignore: ['site/**']
  pull_request:
    paths-ignore: ['site/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  black-box:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contextmesh
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cm_runtime:runtime_test_password@localhost:5432/contextmesh
      MIGRATION_DATABASE_URL: postgres://cm_owner:owner_test_password@localhost:5432/contextmesh
      CONTEXTMESH_TEST_LOG_DIR: /tmp/contextmesh-test-logs
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked
      - name: Create isolated database roles
        run: |
          psql postgres://postgres:postgres@localhost:5432/contextmesh -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE cm_owner LOGIN PASSWORD 'owner_test_password' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE cm_runtime LOGIN PASSWORD 'runtime_test_password' NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE contextmesh OWNER TO cm_owner;
          ALTER SCHEMA public OWNER TO cm_owner;
          SQL
          target/debug/contextmesh migrate --database-url "$MIGRATION_DATABASE_URL"
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/grants.sql
      - name: Exercise real processes and PostgreSQL
        run: |
          set -o pipefail
          mkdir -p "$CONTEXTMESH_TEST_LOG_DIR"
          python3 tests/e2e.py 2>&1 | tee /tmp/contextmesh-test-logs/test-report.log
      - name: Upload process logs and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-logs
          path: /tmp/contextmesh-test-logs
          retention-days: 3
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build and start the documented deployment
        run: |
          docker compose up --build -d
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/ready; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/ready
      - name: Verify capture and retrieval through the container
        env:
          TOKEN: local-person-token-change-before-sharing
        run: |
          curl -fsS http://127.0.0.1:8787/v1/records \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"records":[{"id":"00000000-0000-4000-8000-000000000001","content":"Container persistence canary"}]}'
          python3 - <<'PY'
          import json, os, time, urllib.request
          url='http://127.0.0.1:8787/v1/context'
          for _ in range(60):
              req=urllib.request.Request(url,data=json.dumps({'task':'Container persistence canary'}).encode(),headers={'Authorization':'Bearer '+os.environ['TOKEN'],'Content-Type':'application/json'})
              with urllib.request.urlopen(req) as response:
                  packet=json.load(response)
              if any('Container persistence canary' in record['content'] for record in packet['records']):
                  break
              time.sleep(.5)
          else:
              raise SystemExit('Container curation did not complete')
          PY
      - name: Deployment logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop deployment
        if: always()
        run: docker compose down -v
